<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-overlay"></div>
    
    <main class="center-container fade-in">
        <div id="clock" class="clock">12:00</div>
        <div id="greeting" class="greeting">Good afternoon, Anurag</div>
        
        <div class="focus-container">
            <h3>What is your main focus for today?</h3>
            <input type="text" id="focus-input" autocomplete="off" />
            <div id="focus-display" class="hidden">
                <input type="checkbox" id="focus-check" />
                <span id="focus-text"></span>
                <button id="focus-delete" aria-label="Delete focus">×</button>
            </div>
        </div>
    </main>

    <footer class="bottom-container fade-in-delay">
        <div id="quote-container" class="quote-container">
            <p id="quote-text">“The secret of getting ahead is getting started.”</p>
            <span id="quote-author">Mark Twain</span>
        </div>
    </footer>

    <div id="todo-container" class="todo-container">
        <button id="todo-toggle" class="todo-toggle">Todo</button>
        <div id="todo-panel" class="todo-panel hidden">
            <div class="todo-header">
                <h4>Today</h4>
                <div class="todo-actions">
                    <!-- Placeholder for potential future actions like clear completed -->
                </div>
            </div>
            <ul id="todo-list" class="todo-list">
                <!-- Todos will be injected here -->
            </ul>
            <input type="text" id="todo-input" placeholder="New Todo" autocomplete="off" />
        </div>
    </div>

    <div class="refresh-bg-container">
        <button id="refresh-bg" title="Refresh Wallpaper" aria-label="Refresh Wallpaper">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
            </svg>
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
